<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Was "Packbreaker Arena — Run Screen": an internal screen name, shown in
         the browser tab and used as the fallback link title everywhere. -->
    <title>Packbreaker Arena — the bag is the puzzle</title>
    <meta
      name="description"
      content="A browser auto-battler where you build a bag, arrange it for synergy, and watch it fight. Twelve minutes a run. Nobody waiting on you."
    />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Link preview. og.png is rasterized from scratch/branding/og-card.html —
         social scrapers do not render SVG previews, so this must stay a PNG.
         og:url is deliberately omitted: it would have to be absolute to be
         useful and the deploy origin is not known at build time. Scrapers fall
         back to the URL they fetched, which is correct in every case. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Packbreaker Arena" />
    <meta property="og:title" content="Packbreaker Arena — the bag is the puzzle" />
    <meta
      property="og:description"
      content="A browser auto-battler where you build a bag, arrange it for synergy, and watch it fight. Twelve minutes a run. Nobody waiting on you."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Packbreaker Arena — a dark inventory grid with slots highlighted in blue, amber, green and purple."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Packbreaker Arena — the bag is the puzzle" />
    <meta
      name="twitter:description"
      content="Build a bag, arrange it for synergy, watch it fight. Twelve minutes a run."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 800 added for the run-end / OG display weight. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="no-select">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
